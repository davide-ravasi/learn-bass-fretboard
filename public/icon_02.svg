<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="guitarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8d6e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5d4037;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with square-safe margins -->
  <rect x="10" y="10" width="160" height="160" rx="20" fill="url(#bgGradient)" stroke="#2e7d32" stroke-width="2"/>
  
  <!-- Bass Guitar Body (centered and squared) -->
  <ellipse cx="90" cy="100" rx="35" ry="25" fill="url(#guitarGradient)" stroke="#3e2723" stroke-width="2"/>
  
  <!-- Guitar Neck -->
  <rect x="75" y="60" width="30" height="50" fill="url(#guitarGradient)" stroke="#3e2723" stroke-width="2"/>
  
  <!-- Headstock -->
  <rect x="70" y="40" width="40" height="25" fill="url(#guitarGradient)" stroke="#3e2723" stroke-width="2"/>
  <rect x="75" y="45" width="30" height="15" fill="#5d4037" stroke="#3e2723" stroke-width="1"/>
  
  <!-- Tuning Pegs -->
  <circle cx="78" cy="52" r="3" fill="#ffffff" stroke="#3e2723" stroke-width="1"/>
  <circle cx="82" cy="52" r="3" fill="#ffffff" stroke="#3e2723" stroke-width="1"/>
  <circle cx="86" cy="52" r="3" fill="#ffffff" stroke="#3e2723" stroke-width="1"/>
  <circle cx="90" cy="52" r="3" fill="#ffffff" stroke="#3e2723" stroke-width="1"/>
  
  <!-- Strings (4 strings) -->
  <line x1="78" y1="65" x2="78" y2="110" stroke="url(#stringGradient)" stroke-width="1.5"/>
  <line x1="82" y1="65" x2="82" y2="110" stroke="url(#stringGradient)" stroke-width="1.5"/>
  <line x1="86" y1="65" x2="86" y2="110" stroke="url(#stringGradient)" stroke-width="1.5"/>
  <line x1="90" y1="65" x2="90" y2="110" stroke="url(#stringGradient)" stroke-width="1.5"/>
  
  <!-- Fret Markers -->
  <circle cx="90" cy="75" r="2" fill="#4caf50" stroke="#2e7d32" stroke-width="1"/>
  <circle cx="90" cy="85" r="2" fill="#4caf50" stroke="#2e7d32" stroke-width="1"/>
  <circle cx="90" cy="95" r="2" fill="#4caf50" stroke="#2e7d32" stroke-width="1"/>
  
  <!-- Bridge -->
  <rect x="75" y="108" width="30" height="4" fill="#3e2723" stroke="#1b5e20" stroke-width="1"/>
  
  <!-- Large "B" Letter (centered and prominent) -->
  <text x="90" y="150" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#ffffff" stroke="#2e7d32" stroke-width="1">B</text>
  
  <!-- Subtle musical note symbol -->
  <g transform="translate(140, 50)">
    <circle cx="0" cy="0" r="8" fill="#ffffff" opacity="0.8"/>
    <rect x="8" y="-20" width="3" height="20" fill="#ffffff" opacity="0.8"/>
    <rect x="8" y="-25" width="8" height="3" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
